# Stage 1: Adapter Pretraining Configuration for SLURM Multi-Node
data:
  shuffle: true
  num_workers: 10
  pin_memory: true

training:
  num_epochs: 3
  batch_size: 32 # per-GPU
  grad_accum_steps: 16 # Reduced from 8 to improve gradient freshness
  max_grad_norm: 1.0
  warmup_ratio: 0.05 # Reduced from 0.1 to extend learning phase
  use_scheduler: true # Enable learning rate scheduler
  flat_ratio: 0.6 # Keep learning rate flat for 60% of training
  dropout: 0.1 # Reduced from 0.2 for adapter training
  betas: [0.9, 0.95]
  eps: 1e-8
  learning_rate: 1e-3
  min_lr_ratio: 0.08
  weight_decay: 0.01
  label_smoothing: 0.1
  tau: 0.9 # (CE temperature)
  sim_penalty: false
  sim_weight: 1.0
  lora:
    lr: 5e-4
    weight_decay: 0.01
    min_lr_ratio: 0.10
    warmup_ratio: 0.1

    # layer_lr_strategy:
    #   early:
    #     layers: [0, 15]
    #     multiplier: 2.5
    #   mid:
    #     layers: [16, 27]
    #     multiplier: 1.0
    #   late:
    #     layers: [28, 31]
    #     multiplier: 0.5

lora:
  train: true

  att_r: 8 # LoRA rank
  mlp_r: 0
  att_alpha: 16 # LoRA alpha (scaling factor)
  mlp_alpha: 0
  dropout: 0.05 # LoRA dropout
  target_atts: ["q_proj", "v_proj", "k_proj"]
  target_mlps: []
  layers: [24, 25, 26, 27, 28, 29, 30, 31]
  bias: "none"
  task_type: "CAUSAL_LM"

logging:
  wandb_project: einv-adapter-pretrain
  log_every: 100
  progress_update_freq: 10
  group: "Adapter-l10t16p16"
